# =============================================================================
# Nginx server block for soap.weleber.net  —  SimpleSOAP
# Install to: /etc/nginx/sites-available/soap.weleber.net
# Then symlink into sites-enabled (see deploy/README.md).
#
# Pure static site: nginx serves the built PWA straight from disk. There is no
# application server, no database and no runtime dependency of any kind — the
# whole app is 380 KB of precached assets that then run offline.
#
# No `listen` directive here, so nginx defaults to port 80. That matters:
# `wildcard-redirect` holds `listen 80 default_server` and 301s unmatched
# subdomains to the apex. An explicit server_name always beats a default_server,
# so this block claims soap.weleber.net without touching the wildcard.
#
# certbot will rewrite this block to add the listen 443 / TLS lines automatically.
# =============================================================================

server {
    server_name soap.weleber.net;

    root /var/www/soap.weleber.net;
    index index.html;

    # --- Hashed build assets: the filename changes whenever the bytes do ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- The service worker is how an installed app learns it is out of date ---
    # Cache this and every phone with the app on its home screen stays pinned to
    # whatever version it first installed, with no obvious symptom.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Same reasoning: index.html names the current asset hashes ---
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # --- nginx 1.24's mime.types has no .webmanifest entry, and served as the
    #     wrong type some browsers silently refuse to treat the app as
    #     installable — no error, just no "Add to Home Screen".
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
